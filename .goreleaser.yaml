version: 2

project_name: agent-seatbelt

before:
  hooks:
    - go mod tidy

builds:
  - id: seatbelt
    main: ./cmd/seatbelt
    binary: seatbelt
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/deanyool/agent-seatbelt/internal/version.Version={{ .Version }}

archives:
  - id: seatbelt
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: SHA256SUMS

changelog:
  disable: true
